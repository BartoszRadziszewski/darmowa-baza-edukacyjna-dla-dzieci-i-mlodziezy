<html lang="pl">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog Edukacyjnych Stron i Aplikacji dla Dzieci i Młodzieży</title>
  <meta name="description" content="Otwarta baza darmowych serwisów, aplikacji i bibliotek cyfrowych dla dzieci, młodzieży, rodziców oraz nauczycieli.">
  
  <!-- Open Graph -->
  <meta property="og:title" content="Katalog Narzędzi Edukacyjnych">
  <meta property="og:description" content="Darmowe narzędzia, aplikacje i biblioteki edukacyjne dla dzieci i młodzieży.">
  <meta property="og:type" content="website">

  <!-- Favicon Emoji -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --tag-bg: #0f172a;
      --lang-badge-bg: rgba(16, 185, 129, 0.15);
      --lang-badge-color: #34d399;
      --lang-badge-border: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      padding: 2.5rem 1rem;
    }

    .container {
      max-width: 1140px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.3rem;
      margin-bottom: 0.5rem;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 1.1rem;
      max-width: 700px;
      margin: 0 auto;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      padding: 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .search-box {
      flex: 2 1 260px;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background-color: var(--bg);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .search-box input:focus, select:focus {
      border-color: var(--accent);
    }

    .filter-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      flex: 3 1 420px;
    }

    select {
      flex: 1 1 140px;
      padding: 0.75rem 0.9rem;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background-color: var(--bg);
      color: var(--text-main);
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 0.75rem 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .btn-reset:hover {
      background: var(--card-border);
      color: var(--text-main);
    }

    .counter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: var(--text-muted);
      padding: 0 0.25rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 1.35rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .card-tags {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.85rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .tag {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 5px;
      background: var(--tag-bg);
      color: var(--accent);
      border: 1px solid var(--card-border);
      font-weight: 500;
    }

    .tag-lang {
      background: var(--lang-badge-bg);
      color: var(--lang-badge-color);
      border-color: var(--lang-badge-border);
      font-weight: 600;
    }

    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      line-height: 1.3;
    }

    .card-desc {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 1.35rem;
      flex-grow: 1;
    }

    .card-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      text-decoration: none;
      color: #0f172a;
      background-color: var(--accent);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.65rem 1rem;
      border-radius: 8px;
      text-align: center;
      transition: background-color 0.15s ease;
    }

    .card-link:hover {
      background-color: var(--accent-hover);
      color: #ffffff;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }

    .empty-state p {
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .empty-state button {
      padding: 0.6rem 1.2rem;
      background: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

        </select>
        <button class="btn-reset" id="resetBtn" title="Resetuj filtry">Wyczyść</button>
      </div>
    </div>

    <div class="counter-bar">
      <div id="itemCount">Ładowanie bazy danych...</div>
    </div>

    <div class="grid" id="itemsGrid"></div>
  </div>

      { name: "Tomasz Gwiazda (YouTube)", age: "12+", cat: "Matematyka", lang: "PL", desc: "Czytelne wideolekcje tłumaczące krok po kroku materiał szkolny z matematyki.", url: "https://www.youtube.com/@TomaszGwiazda" },
      { name: "Internet Archive (archive.org)", age: "12+", cat: "Czytanie", lang: "Wielojęzyczny", desc: "Globalna biblioteka cyfrowa: miliony bezpłatnych książek, starych gier i nagrań.", url: "https://archive.org" },
      { name: "Duolingo", age: "12+", cat: "Języki", lang: "PL/EN", desc: "Grywalizacyjna nauka języków obcych (także z polskiego) w aplikacji i na WWW.", url: "https://duolingo.com" },
      { name: "Insta.Ling", age: "12+", cat: "Języki", lang: "PL", desc: "System do systematycznej nauki i powtórek słówek z języków obcych w szkołach.", url: "https://instaling.pl" },
      { name: "BeepBox", age: "12+", cat: "Sztuka", lang: "EN", desc: "Darmowe, przeglądarkowe narzędzie do komponowania i szkicowania muzyki chiptune.", url: "https://www.beepbox.co" },
      { name: "musictheory.net", age: "12+", cat: "Sztuka", lang: "EN", desc: "Lekcje zapisu nutowego, akordów i harmonii wraz z ćwiczeniami kształcenia słuchu.", url: "https://www.musictheory.net" },
      { name: "Lichess", age: "12+", cat: "Sztuka", lang: "PL/EN", desc: "W 100% darmowa platforma szachowa open-source bez reklam, z analizą partii.", url: "https://lichess.org" },

      // Edukatorzy / Rodzice
      { name: "LEGO Education", age: "Nauczyciele", cat: "Materiały", lang: "PL/EN", desc: "Gotowe scenariusze lekcji i projekty z obszaru STEAM do pracy w klasie i w domu.", url: "https://education.lego.com" },
      { name: "Common Sense Media", age: "Nauczyciele", cat: "Materiały", lang: "EN", desc: "Niezależne recenzje gier, filmów, książek i aplikacji pod kątem wieku i bezpieczeństwa.", url: "https://www.commonsensemedia.org" },
      { name: "Edukacja Medialna", age: "Nauczyciele", cat: "Materiały", lang: "PL", desc: "Materiały o higienie cyfrowej, weryfikacji informacji i prawie autorskim.", url: "https://edukacjamedialna.edu.pl" },
      { name: "SaferInternet.pl", age: "Nauczyciele", cat: "Materiały", lang: "PL", desc: "Oficjalne poradniki i pakiety edukacyjne o cyberbezpieczeństwie dzieci.", url: "https://saferinternet.pl" }
    ];

    const searchInput = document.getElementById('searchInput');
    const ageFilter = document.getElementById('ageFilter');
    const catFilter = document.getElementById('catFilter');
    const langFilter = document.getElementById('langFilter');
    const resetBtn = document.getElementById('resetBtn');
    const itemsGrid = document.getElementById('itemsGrid');
    const itemCount = document.getElementById('itemCount');

    function resetFilters() {
      searchInput.value = '';
      ageFilter.value = '';
      catFilter.value = '';
      langFilter.value = '';
      render();
    }

    function render() {
      const query = searchInput.value.toLowerCase().trim();
      const age = ageFilter.value;
      const cat = catFilter.value;
      const lang = langFilter.value;

      const filtered = resources.filter(item => {
        const matchesQuery = item.name.toLowerCase().includes(query) || 
                             item.desc.toLowerCase().includes(query) ||
                             item.cat.toLowerCase().includes(query) ||
                             item.lang.toLowerCase().includes(query);
        
        const matchesAge = !age || item.age === age;
        const matchesCat = !cat || item.cat === cat;
        
        const matchesLang = !lang || 
                            item.lang === lang || 
                            (lang === 'PL' && item.lang.includes('PL')) ||
                            (lang === 'EN' && item.lang.includes('EN')) ||
                            item.lang === 'Wielojęzyczny';

        return matchesQuery && matchesAge && matchesCat && matchesLang;
      });

      itemCount.textContent = `Wyświetlane pozycje: ${filtered.length} z ${resources.length}`;

      if (filtered.length === 0) {
        itemsGrid.innerHTML = `
          <div class="empty-state">
            <p>Nie znaleziono pozycji spełniających podane kryteria.</p>
            <button onclick="resetFilters()">Zresetuj filtry</button>
          </div>
        `;
        return;
      }

      itemsGrid.innerHTML = filtered.map(item => `
        <article class="card">
          <div>
            <div class="card-tags">
              <span class="tag">${item.age === 'Nauczyciele' ? 'Dla edukatorów' : 'Wiek: ' + item.age}</span>
              <span class="tag">${item.cat}</span>
              <span class="tag tag-lang">[${item.lang}]</span>
            </div>
            <h2 class="card-title">${item.name}</h2>
            <p class="card-desc">${item.desc}</p>
          </div>
          <a class="card-link" href="${item.url}" target="_blank" rel="noopener noreferrer">
            Przejdź do strony <span>&rarr;</span>
          </a>
        </article>
      `).join('');
    }

    searchInput.addEventListener('input', render);
    ageFilter.addEventListener('change', render);
    catFilter.addEventListener('change', render);
    langFilter.addEventListener('change', render);
    resetBtn.addEventListener('click', resetFilters);

    render();
  </script>
</body>
</html>
